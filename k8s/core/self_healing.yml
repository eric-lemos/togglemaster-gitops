apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing
  namespace: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-healing
  template:
    metadata:
      labels:
        app: self-healing
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: self-healing
          image: 730335623958.dkr.ecr.us-east-1.amazonaws.com/togglemaster/self_healing:f9e681458e53a9a65668747e902448de6ff619d0
          ports:
            - containerPort: 8443
          env:
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: auth-self-healing-app
                  key: app-id
            - name: GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: auth-self-healing-app
                  key: installation-id
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: 8443
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /secrets/app
              readOnly: true
            - name: self-healing-token
              mountPath: /secrets/self_healing
              readOnly: true
            - name: tls
              mountPath: /secrets/tls
              readOnly: true
      volumes:
        - name: app
          secret:
            secretName: auth-self-healing-app
        - name: self-healing-token
          secret:
            secretName: self-healing
        - name: tls
          secret:
            secretName: self-healing-tls
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing
  namespace: togglemaster
spec:
  type: ClusterIP
  selector:
    app: self-healing
  ports:
    - port: 8443
      targetPort: 8443
