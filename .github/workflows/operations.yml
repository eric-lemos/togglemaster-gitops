name: K8s Ops

on:
  workflow_dispatch:
    inputs:
      kubernetes_apply:
        description: "Kubernetes Apply"
        required: true
        default: false
        type: boolean
      run_postgres_schema_job:
        description: "Postgres Schema"
        required: true
        default: false
        type: boolean
      validate_apps:
        description: "Validate Togglemaster"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  image:
    name: Image Build
    runs-on: ubuntu-latest
    if: inputs.kubernetes_apply
    permissions:
      contents: write
    steps:
      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Kubernetes Apply must run from main because it commits the webhook image." >&2
            exit 1
          fi

      - name: Checkout GitOps repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute image tag
        run: echo "TAG=$(git rev-parse HEAD:scripts/webhook)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image="$REGISTRY/togglemaster/webhook:$TAG"
          tags="$(aws ecr list-images --repository-name togglemaster/webhook --filter tagStatus=TAGGED --query 'imageIds[].imageTag' --output json --region "$AWS_REGION")"
          if printf '%s' "$tags" | jq -e --arg tag "$TAG" 'index($tag) != null' >/dev/null; then
            echo "Image tag already exists; skipping build."
          else
            docker build -t "$image" scripts/webhook
            docker push "$image"
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Update webhook manifest
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The build revision is no longer an ancestor of main; rerun the workflow." >&2
            exit 1
          fi
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- scripts/webhook; then
            echo "Webhook files changed during the build; rerun the workflow on the latest main." >&2
            exit 1
          fi
          git switch --detach origin/main
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("k8s/core/webhook.yml")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^([ \t]*image:[ \t]*)\S+([ \t]*)$",
              lambda match: match.group(1) + os.environ["IMAGE"] + match.group(2),
              content,
          )
          if count != 1:
              raise SystemExit("Expected exactly one image field in k8s/core/webhook.yml.")
          path.write_text(updated, encoding="utf-8")
          PY
          git add k8s/core/webhook.yml
          if git diff --cached --quiet; then
            echo "Webhook manifest already references this image."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update webhook image"
          git push origin HEAD:main

  deploy:
    name: Apply K8s Manifests
    runs-on: ubuntu-latest
    needs: image
    if: inputs.kubernetes_apply
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Prepare namespace and runtime secrets
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          FLAG_DATABASE_URL: ${{ secrets.FLAG_DATABASE_URL }}
          TARGETING_DATABASE_URL: ${{ secrets.TARGETING_DATABASE_URL }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          AWS_SQS_URL: ${{ vars.AWS_SQS_URL }}
          AWS_DYNAMODB_TABLE: ${{ vars.AWS_DYNAMODB_TABLE }}
        run: |
          required_values=(
            AUTH_DATABASE_URL
            FLAG_DATABASE_URL
            TARGETING_DATABASE_URL
            MASTER_KEY
            REDIS_URL
            AWS_SQS_URL
            AWS_DYNAMODB_TABLE
          )
          for variable_name in "${required_values[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Required configuration is missing: $variable_name" >&2
              exit 1
            fi
          done

          kubectl apply -f k8s/core/namespace.yml
          kubectl create secret generic togglemaster-secrets \
            --namespace togglemaster \
            --from-literal=AUTH_DATABASE_URL="$AUTH_DATABASE_URL" \
            --from-literal=FLAG_DATABASE_URL="$FLAG_DATABASE_URL" \
            --from-literal=TARGETING_DATABASE_URL="$TARGETING_DATABASE_URL" \
            --from-literal=MASTER_KEY="$MASTER_KEY" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=AWS_REGION="$AWS_REGION" \
            --from-literal=AWS_SQS_URL="$AWS_SQS_URL" \
            --from-literal=AWS_DYNAMODB_TABLE="$AWS_DYNAMODB_TABLE" \
            --dry-run=client \
            --output=yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s
          kubectl apply -f k8s/core/argocd.yml

  secrets:
    name: Configure Secrets
    runs-on: ubuntu-latest
    needs: deploy
    if: inputs.kubernetes_apply
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Provision webhook secrets
        env:
          APP_ID: ${{ vars.SELF_HEALING_APP_ID }}
          INSTALLATION_ID: ${{ vars.SELF_HEALING_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SELF_HEALING_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "$APP_ID" =~ ^[0-9]+$ || ! "$INSTALLATION_ID" =~ ^[0-9]+$ || -z "$APP_PRIVATE_KEY" ]] ||
             [[ "$APP_ID" =~ ^0+$ || "$INSTALLATION_ID" =~ ^0+$ ]]; then
            echo "Configure positive App and installation IDs and the GitHub App private key." >&2
            exit 1
          fi
          work_dir="$(mktemp -d)"
          trap 'rm -f "$work_dir"/app.pem "$work_dir"/token "$work_dir"/peer-token "$work_dir"/tls.crt "$work_dir"/tls.key "$work_dir"/peer.crt "$work_dir"/cert.pub "$work_dir"/key.pub; rmdir "$work_dir"' EXIT
          printf '%s\n' "$APP_PRIVATE_KEY" > "$work_dir/app.pem"
          unset APP_PRIVATE_KEY
          openssl pkey -in "$work_dir/app.pem" -check -noout >/dev/null
          openssl pkey -in "$work_dir/app.pem" -pubout | openssl rsa -pubin -noout >/dev/null

          secret_versions() {
            for secret in "togglemaster auth-self-healing-app" "togglemaster webhook" "togglemaster auth-self-healing-tls" "observability webhook"; do
              set -- $secret
              kubectl -n "$1" get secret "$2" --ignore-not-found -o jsonpath='{.metadata.resourceVersion}'
              echo
            done
          }
          versions_before="$(secret_versions)"

          app_token="$(kubectl -n togglemaster get secret webhook --ignore-not-found -o name)"
          peer_secret="$(kubectl -n observability get secret webhook --ignore-not-found -o name)"
          tls_secret="$(kubectl -n togglemaster get secret auth-self-healing-tls --ignore-not-found -o name)"
          if [[ -n "$app_token" ]]; then
            kubectl -n togglemaster get secret webhook -o jsonpath='{.data.token}' | base64 --decode > "$work_dir/token"
          fi
          if [[ -n "$peer_secret" ]]; then
            kubectl -n observability get secret webhook -o jsonpath='{.data.token}' | base64 --decode > "$work_dir/peer-token"
            kubectl -n observability get secret webhook -o jsonpath='{.data.ca\.crt}' | base64 --decode > "$work_dir/peer.crt"
            if [[ ! -s "$work_dir/peer-token" || ! -s "$work_dir/peer.crt" ]]; then
              echo "The existing observability secret is incomplete." >&2
              exit 1
            fi
            if [[ -n "$app_token" ]] && ! cmp -s "$work_dir/token" "$work_dir/peer-token"; then
              echo "Webhook tokens differ between namespaces; disable the receiver and resolve the inconsistent secrets." >&2
              exit 1
            fi
            if [[ -z "$app_token" ]]; then
              cp "$work_dir/peer-token" "$work_dir/token"
            fi
          fi
          if [[ -z "$app_token" && -z "$peer_secret" ]]; then
            openssl rand -hex 32 | tr -d '\n' > "$work_dir/token"
          fi
          token_length="$(wc -c < "$work_dir/token")"
          if [[ "$token_length" -lt 32 || "$token_length" -ne "$(tr -d '[:space:]' < "$work_dir/token" | wc -c)" ]]; then
            echo "The existing webhook token is invalid." >&2
            exit 1
          fi
          if [[ -n "$tls_secret" ]]; then
            kubectl -n togglemaster get secret auth-self-healing-tls -o jsonpath='{.data.tls\.crt}' | base64 --decode > "$work_dir/tls.crt"
            kubectl -n togglemaster get secret auth-self-healing-tls -o jsonpath='{.data.tls\.key}' | base64 --decode > "$work_dir/tls.key"
            if [[ -n "$peer_secret" ]] && ! cmp -s "$work_dir/tls.crt" "$work_dir/peer.crt"; then
              echo "Webhook certificates differ between namespaces; disable the receiver and resolve the inconsistent secrets." >&2
              exit 1
            fi
          elif [[ -n "$peer_secret" ]]; then
            echo "The webhook TLS private key is missing; disable the receiver and resolve the inconsistent secrets." >&2
            exit 1
          else
            openssl req -x509 -newkey rsa:3072 -nodes -days 90 \
              -keyout "$work_dir/tls.key" -out "$work_dir/tls.crt" \
              -subj '/CN=webhook.togglemaster.svc' \
              -addext 'subjectAltName=DNS:webhook.togglemaster.svc' \
              -addext 'basicConstraints=critical,CA:TRUE' \
              -addext 'keyUsage=critical,digitalSignature,keyEncipherment,keyCertSign' \
              -addext 'extendedKeyUsage=serverAuth' >/dev/null 2>&1
          fi
          if ! openssl x509 -in "$work_dir/tls.crt" -checkend 604800 -noout >/dev/null; then
            echo "Webhook TLS certificate is invalid or expires within seven days; disable the receiver and replace the credentials." >&2
            exit 1
          fi
          openssl verify -purpose sslserver -verify_hostname webhook.togglemaster.svc \
            -CAfile "$work_dir/tls.crt" "$work_dir/tls.crt" >/dev/null
          openssl x509 -in "$work_dir/tls.crt" -pubkey -noout > "$work_dir/cert.pub"
          openssl pkey -in "$work_dir/tls.key" -pubout > "$work_dir/key.pub"
          if ! cmp -s "$work_dir/cert.pub" "$work_dir/key.pub"; then
            echo "Webhook TLS certificate and private key do not match." >&2
            exit 1
          fi
          kubectl -n togglemaster create secret generic auth-self-healing-app \
            --from-literal="app-id=$APP_ID" --from-literal="installation-id=$INSTALLATION_ID" \
            --from-file="private-key.pem=$work_dir/app.pem" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n togglemaster create secret generic webhook \
            --from-file="token=$work_dir/token" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n togglemaster create secret tls auth-self-healing-tls \
            --cert="$work_dir/tls.crt" --key="$work_dir/tls.key" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n observability create secret generic webhook \
            --from-file="token=$work_dir/token" --from-file="ca.crt=$work_dir/tls.crt" \
            --dry-run=client -o yaml | kubectl apply -f -
          if [[ "$versions_before" != "$(secret_versions)" ]]; then
            deployment="$(kubectl -n togglemaster get deployment webhook --ignore-not-found -o name)"
            if [[ -n "$deployment" ]]; then
              kubectl -n togglemaster rollout restart deployment/webhook
              kubectl -n togglemaster rollout status deployment/webhook --timeout=300s
            fi
          fi
          echo "Webhook secrets ready. TLS certificate expiry:"
          openssl x509 -in "$work_dir/tls.crt" -noout -enddate

  config:
    name: Postgres Schema
    runs-on: ubuntu-latest
    if: inputs.run_postgres_schema_job
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Prepare namespace and runtime secrets
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          FLAG_DATABASE_URL: ${{ secrets.FLAG_DATABASE_URL }}
          TARGETING_DATABASE_URL: ${{ secrets.TARGETING_DATABASE_URL }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          AWS_SQS_URL: ${{ vars.AWS_SQS_URL }}
          AWS_DYNAMODB_TABLE: ${{ vars.AWS_DYNAMODB_TABLE }}
        run: |
          required_values=(
            AUTH_DATABASE_URL
            FLAG_DATABASE_URL
            TARGETING_DATABASE_URL
            MASTER_KEY
            REDIS_URL
            AWS_SQS_URL
            AWS_DYNAMODB_TABLE
          )
          for variable_name in "${required_values[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Required configuration is missing: $variable_name" >&2
              exit 1
            fi
          done

          kubectl apply -f k8s/core/namespace.yml
          kubectl create secret generic togglemaster-secrets \
            --namespace togglemaster \
            --from-literal=AUTH_DATABASE_URL="$AUTH_DATABASE_URL" \
            --from-literal=FLAG_DATABASE_URL="$FLAG_DATABASE_URL" \
            --from-literal=TARGETING_DATABASE_URL="$TARGETING_DATABASE_URL" \
            --from-literal=MASTER_KEY="$MASTER_KEY" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=AWS_REGION="$AWS_REGION" \
            --from-literal=AWS_SQS_URL="$AWS_SQS_URL" \
            --from-literal=AWS_DYNAMODB_TABLE="$AWS_DYNAMODB_TABLE" \
            --dry-run=client \
            --output=yaml | kubectl apply -f -

      - name: Run Postgres Schema Job
        run: |
          kubectl delete job postgres-schema-init \
            --namespace togglemaster \
            --ignore-not-found
          kubectl apply -f k8s/jobs/postgres.yml
          kubectl wait \
            --namespace togglemaster \
            --for=condition=complete \
            --timeout=10m \
            job/postgres-schema-init
          kubectl logs \
            --namespace togglemaster \
            job/postgres-schema-init

  validate:
    name: Validate Togglemaster
    runs-on: ubuntu-latest
    needs: [secrets, config]
    if: ${{ !cancelled() && inputs.validate_apps && !contains(needs.*.result, 'failure') }}
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: python -m pip install -r scripts/uat/requirements.txt

      - name: Wait for application rollouts
        run: |
          deployments=$(kubectl get deployments --namespace togglemaster --output name)
          if [[ -z "$deployments" ]]; then
            echo "No deployments found in namespace togglemaster" >&2
            exit 1
          fi
          for deployment in $deployments; do
            kubectl rollout status "$deployment" --namespace togglemaster --timeout=300s
          done

      - name: Run end-to-end validation
        env:
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/uat/user_testing.py
