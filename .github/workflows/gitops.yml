name: GitOps

on:
  workflow_dispatch:
    inputs:
      kubernetes_apply:
        description: "Kubernetes Apply"
        required: true
        default: false
        type: boolean
      run_postgres_schema_job:
        description: "Config DB Schema"
        required: true
        default: false
        type: boolean
      validate_apps:
        description: "Validate Apps"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  deploy:
    name: Kubernetes Apply
    runs-on: ubuntu-latest
    if: inputs.kubernetes_apply
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Prepare namespace and runtime secrets
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          FLAG_DATABASE_URL: ${{ secrets.FLAG_DATABASE_URL }}
          TARGETING_DATABASE_URL: ${{ secrets.TARGETING_DATABASE_URL }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          AWS_SQS_URL: ${{ vars.AWS_SQS_URL }}
          AWS_DYNAMODB_TABLE: ${{ vars.AWS_DYNAMODB_TABLE }}
        run: |
          required_values=(
            AUTH_DATABASE_URL
            FLAG_DATABASE_URL
            TARGETING_DATABASE_URL
            MASTER_KEY
            REDIS_URL
            AWS_SQS_URL
            AWS_DYNAMODB_TABLE
          )
          for variable_name in "${required_values[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Required configuration is missing: $variable_name" >&2
              exit 1
            fi
          done

          kubectl apply -f base/namespace.yaml
          kubectl create secret generic togglemaster-secrets \
            --namespace togglemaster \
            --from-literal=AUTH_DATABASE_URL="$AUTH_DATABASE_URL" \
            --from-literal=FLAG_DATABASE_URL="$FLAG_DATABASE_URL" \
            --from-literal=TARGETING_DATABASE_URL="$TARGETING_DATABASE_URL" \
            --from-literal=MASTER_KEY="$MASTER_KEY" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=AWS_REGION="$AWS_REGION" \
            --from-literal=AWS_SQS_URL="$AWS_SQS_URL" \
            --from-literal=AWS_DYNAMODB_TABLE="$AWS_DYNAMODB_TABLE" \
            --dry-run=client \
            --output=yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k .
          kubectl apply -f argocd/application.yaml

  config:
    name: Config DB Schema
    runs-on: ubuntu-latest
    if: inputs.run_postgres_schema_job
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Prepare namespace and runtime secrets
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          FLAG_DATABASE_URL: ${{ secrets.FLAG_DATABASE_URL }}
          TARGETING_DATABASE_URL: ${{ secrets.TARGETING_DATABASE_URL }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          AWS_SQS_URL: ${{ vars.AWS_SQS_URL }}
          AWS_DYNAMODB_TABLE: ${{ vars.AWS_DYNAMODB_TABLE }}
        run: |
          required_values=(
            AUTH_DATABASE_URL
            FLAG_DATABASE_URL
            TARGETING_DATABASE_URL
            MASTER_KEY
            REDIS_URL
            AWS_SQS_URL
            AWS_DYNAMODB_TABLE
          )
          for variable_name in "${required_values[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Required configuration is missing: $variable_name" >&2
              exit 1
            fi
          done

          kubectl apply -f base/namespace.yaml
          kubectl create secret generic togglemaster-secrets \
            --namespace togglemaster \
            --from-literal=AUTH_DATABASE_URL="$AUTH_DATABASE_URL" \
            --from-literal=FLAG_DATABASE_URL="$FLAG_DATABASE_URL" \
            --from-literal=TARGETING_DATABASE_URL="$TARGETING_DATABASE_URL" \
            --from-literal=MASTER_KEY="$MASTER_KEY" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=AWS_REGION="$AWS_REGION" \
            --from-literal=AWS_SQS_URL="$AWS_SQS_URL" \
            --from-literal=AWS_DYNAMODB_TABLE="$AWS_DYNAMODB_TABLE" \
            --dry-run=client \
            --output=yaml | kubectl apply -f -

      - name: Run Postegres Schema Job
        run: |
          kubectl delete job postgres-schema-init \
            --namespace togglemaster \
            --ignore-not-found
          kubectl apply -f jobs/postgres-job.yaml
          kubectl wait \
            --namespace togglemaster \
            --for=condition=complete \
            --timeout=10m \
            job/postgres-schema-init
          kubectl logs \
            --namespace togglemaster \
            job/postgres-schema-init

  validate:
    name: Validate Apps
    runs-on: ubuntu-latest
    needs: [deploy, utils]
    if: ${{ !cancelled() && inputs.validate_apps && !contains(needs.*.result, 'failure') }}
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Wait for application rollouts
        run: |
          deployments=$(kubectl get deployments --namespace togglemaster --output name)
          if [[ -z "$deployments" ]]; then
            echo "No deployments found in namespace togglemaster" >&2
            exit 1
          fi
          for deployment in $deployments; do
            kubectl rollout status "$deployment" --namespace togglemaster --timeout=300s
          done

      - name: Run end-to-end validation
        env:
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/validate_apps.py
