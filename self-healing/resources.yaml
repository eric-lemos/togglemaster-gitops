apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-self-healing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-self-healing
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["auth-service"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-self-healing
subjects:
  - kind: ServiceAccount
    name: auth-self-healing
    namespace: togglemaster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-self-healing
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: auth-self-healing
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 50
      template:
        spec:
          serviceAccountName: auth-self-healing
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: self-healing
              image: python:3.11-slim
              command: ["python", "/app/self_healing.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: auth-self-healing-script
