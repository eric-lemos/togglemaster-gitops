apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eric-lemos/togglemaster-f3-gitops.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: auth-service
      namespace: togglemaster
      jsonPointers:
        - /metadata/annotations/togglemaster.io~1self-healing-history
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
